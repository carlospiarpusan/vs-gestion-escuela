name: Supabase Maintenance Keepalive (GitHub Actions)

on:
  schedule:
    # Ejecuta dos veces al día (04:00 UTC y 16:00 UTC) directamente desde GitHub Actions
    - cron: '0 4,16 * * *'
  workflow_dispatch:
    inputs:
      custom_url:
        description: 'URL base personalizada (opcional, por defecto usa APP_URL o https://condusoft.co)'
        required: false
        default: ''

jobs:
  supabase-ping:
    name: Supabase Keepalive & Health Ping
    runs-on: ubuntu-latest
    steps:
      - name: 1. Ping directo a Supabase API Gateway (PostgREST)
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://oyptexglggazvqaofqaj.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im95cHRleGdsZ2dhenZxYW9mcWFqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA4MzMxODUsImV4cCI6MjA4NjQwOTE4NX0.sAyeyaH4PTvmxJhYz14jlLBST3LQqZf3Jnw6nXIiPnY' }}
        run: |
          echo "📡 Ejecutando ping directo a la API de Supabase: $SUPABASE_URL/rest/v1/escuelas"
          DIRECT_RESPONSE=$(curl -s -S -w "\nHTTP_STATUS:%{http_code}" \
            -X GET "$SUPABASE_URL/rest/v1/escuelas?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "User-Agent: GitHubActions-SupabaseDirectPing/1.0" \
            --max-time 30)

          DIRECT_STATUS=$(echo "$DIRECT_RESPONSE" | tail -n 1 | sed -e 's/HTTP_STATUS://')
          echo "Código HTTP directo Supabase: $DIRECT_STATUS"

          if [ "$DIRECT_STATUS" -ne 200 ]; then
            echo "⚠️ Advertencia: Supabase directo retornó código $DIRECT_STATUS"
          else
            echo "✅ Supabase REST API respondió correctamente (activo)."
          fi

      - name: 2. Ping al Endpoint de Mantenimiento (PostgreSQL Pooler + Warmup)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ inputs.custom_url != '' && inputs.custom_url || secrets.APP_URL || 'https://condusoft.co' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "⚠️ [WARN] La variable CRON_SECRET no está configurada en GitHub Secrets."
            exit 1
          fi

          TARGET_URL="${APP_URL%/}/api/cron/supabase-ping"
          echo "🚀 Ejecutando ping de mantenimiento contra: $TARGET_URL"

          HTTP_RESPONSE=$(curl -s -S -w "\nHTTP_STATUS:%{http_code}" \
            -X GET "$TARGET_URL" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "User-Agent: GitHubActions-SupabaseKeepalive/1.0" \
            --max-time 30)

          HTTP_BODY=$(echo "$HTTP_RESPONSE" | sed -e '$d')
          HTTP_STATUS=$(echo "$HTTP_RESPONSE" | tail -n 1 | sed -e 's/HTTP_STATUS://')

          echo "Código HTTP recibido: $HTTP_STATUS"
          echo "Reporte de estado:"
          echo "$HTTP_BODY"

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "❌ Error: El ping de mantenimiento retornó código $HTTP_STATUS (se esperaba 200)."
            exit 1
          fi

          echo "✅ Ping de mantenimiento completado exitosamente por GitHub Actions."
